[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "politepool"
version = "0.1.0"
description = "A process pool that yields to the human at the keyboard."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Thomas Mark Schaefer", email = "gaoptimize@hotmail.com" }]
keywords = [
    "multiprocessing", "process-pool", "concurrent-futures", "priority",
    "nice", "cpu", "scheduling", "background-jobs", "responsiveness",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Distributed Computing",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
# Enables load-aware and memory-aware pool sizing. Without it politepool
# still works; it just assumes the machine is idle and relies on RESERVED_CORES.
adaptive = ["psutil>=5.9"]

[project.urls]
Homepage = "https://github.com/gaoptimize/politepool"
Issues = "https://github.com/gaoptimize/politepool/issues"

[tool.setuptools]
packages = ["politepool"]
